<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kotowari Accountability Workbench</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f7f7f5;
        color: #1f2420;
      }
      body {
        margin: 0;
      }
      header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid #d9ddd8;
        background: #ffffff;
      }
      main {
        display: grid;
        grid-template-columns: minmax(18rem, 25rem) minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem 2rem 2rem;
      }
      nav,
      section {
        background: #ffffff;
        border: 1px solid #d9ddd8;
        border-radius: 0.75rem;
        padding: 1rem;
      }
      .stack {
        display: grid;
        gap: 0.75rem;
      }
      input,
      button,
      select {
        font: inherit;
        padding: 0.55rem 0.65rem;
      }
      button {
        cursor: pointer;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.85rem;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f3f5f2;
        padding: 1rem;
        border-radius: 0.5rem;
        min-height: 16rem;
      }
      .muted {
        color: #616b62;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .metric {
        padding: 0.5rem 0.75rem;
        border: 1px solid #d9ddd8;
        border-radius: 999px;
        font-size: 0.85rem;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kotowari Accountability Workbench</h1>
      <p class="muted">
        Inspect what was known, what was authorized, which policy applied, and why a decision happened.
      </p>
    </header>
    <main>
      <nav class="stack">
        <h2>Investigate</h2>
        <label>
          Query or entity
          <input id="query" value="Vendor X" />
        </label>
        <label>
          Purpose
          <input id="purpose" value="audit" />
        </label>
        <label>
          Valid at
          <input id="validAt" type="datetime-local" />
        </label>
        <label>
          Known at
          <input id="knownAt" type="datetime-local" />
        </label>
        <div class="row">
          <button id="search" type="button">Search knowledge</button>
          <button id="resolve" type="button">Resolve entity</button>
        </div>
        <hr />
        <h2>Decisions</h2>
        <button id="decisions" type="button">List decisions</button>
        <label>
          Decision ID
          <input id="decisionId" placeholder="DecisionId" />
        </label>
        <div class="row">
          <button id="replay" type="button">Replay</button>
          <button id="precedents" type="button">Precedents</button>
          <button id="provenance" type="button">Provenance</button>
        </div>
        <hr />
        <button id="policies" type="button">Policy versions</button>
      </nav>
      <section>
        <div class="row" id="metrics">
          <span class="metric">Temporal reconstruction</span>
          <span class="metric">Authorization receipts</span>
          <span class="metric">Policy versions</span>
          <span class="metric">Deterministic replay</span>
        </div>
        <h2 id="resultTitle">Workbench result</h2>
        <pre id="output">Choose an investigation action.</pre>
      </section>
    </main>
    <script>
      const output = document.getElementById('output');
      const resultTitle = document.getElementById('resultTitle');
      const value = (id) => document.getElementById(id).value;
      const show = (title, data) => {
        resultTitle.textContent = title;
        output.textContent = JSON.stringify(data, null, 2);
      };
      const temporal = () => {
        const result = {};
        if (value('validAt')) result.validAt = new Date(value('validAt')).toISOString();
        if (value('knownAt')) result.knownAt = new Date(value('knownAt')).toISOString();
        return result;
      };
      const json = async (url, options) => {
        const response = await fetch(url, options);
        const body = await response.json();
        if (!response.ok) throw new Error(JSON.stringify(body));
        return body;
      };
      document.getElementById('search').onclick = async () => {
        const data = await json('/v1/knowledge/search', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ query: value('query'), purpose: value('purpose'), temporal: temporal() }),
        });
        show('Knowledge + retrieval receipt', data);
      };
      document.getElementById('resolve').onclick = async () => {
        const data = await json('/v1/entities/resolve', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: value('query'), limit: 8 }),
        });
        show('Entity resolution candidates', data);
      };
      document.getElementById('decisions').onclick = async () => {
        const data = await json('/v1/decisions');
        show('Decision timeline', data);
        if (Array.isArray(data) && data[0]?.id) document.getElementById('decisionId').value = data[0].id;
      };
      document.getElementById('replay').onclick = async () => {
        show('Deterministic decision replay', await json(`/v1/decisions/${value('decisionId')}/replay`));
      };
      document.getElementById('precedents').onclick = async () => {
        show('Decision precedents', await json(`/v1/decisions/${value('decisionId')}/precedents`));
      };
      document.getElementById('provenance').onclick = async () => {
        show('Decision provenance', await json(`/v1/decisions/${value('decisionId')}/prov`));
      };
      document.getElementById('policies').onclick = async () => {
        show('Policy versions', await json('/v1/policies'));
      };
      window.addEventListener('unhandledrejection', (event) => show('Request failed', { error: String(event.reason) }));
    </script>
  </body>
</html>
