name: Fix conflict app lines

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/semantic-conflict-detection-v1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract semantic conflict composition
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/application/src/create-app.ts')
          text = p.read_text()
          marker = '''export function createKotowariApp(
            ports: KotowariPorts,
            options: KotowariAppOptions = {},
          ): KotowariApp {'''
          helper = '''async function detectSemanticConflictsFor(
            store: CanonicalStore,
            principal: Principal,
            contract: SemanticContract,
          ): Promise<readonly Conflict[]> {
            return detectClaimConflicts({
              store,
              principal,
              rules: semanticContractConflictRules(contract),
            });
          }

          '''
          if marker not in text:
              raise SystemExit('createKotowariApp marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '''    async detectSemanticConflicts(contract) {
              return detectClaimConflicts({
                store: ports.store,
                principal: await current(),
                rules: semanticContractConflictRules(contract),
              });
            },'''
          new = '''    async detectSemanticConflicts(contract) {
              return detectSemanticConflictsFor(ports.store, await current(), contract);
            },'''
          if old not in text:
              raise SystemExit('semantic conflict method block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/application/src/create-app.ts
      - name: Commit extraction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/application/src/create-app.ts
          git commit -m 'refactor(application): extract conflict detection composition'
          git push origin HEAD:feat/semantic-conflict-detection-v1
