name: Fix retrieval import groups

on:
  push:
    branches:
      - feat/retrieval-rollout-control-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/retrieval-rollout-control-v1
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/projection-serving.ts')
          text = path.read_text()
          old = "import { stableCanarySample } from './retrieval-rollout.js';\nimport type { RetrievalRolloutMode, RetrievalRolloutPolicy } from './retrieval-rollout.js';\n\nimport type {"
          new = "import { stableCanarySample } from './retrieval-rollout.js';\n\nimport type { RetrievalRolloutMode, RetrievalRolloutPolicy } from './retrieval-rollout.js';\nimport type {"
          if old not in text:
              raise SystemExit('import grouping pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src/projection-serving.ts
          git commit -m 'style: align retrieval import groups'
          git push origin HEAD:feat/retrieval-rollout-control-v1
