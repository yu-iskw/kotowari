name: Fix pgvector HNSW tranche

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/pgvector-hnsw-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/pgvector-hnsw-v1
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reorder projection members
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/adapter-postgres/src/retrieval-projection.ts')
          text = path.read_text()
          start = text.index('  private async initialize(): Promise<void> {')
          end = text.index('  async rebuildVectorIndex(): Promise<void> {')
          helpers = text[start:end]
          text = text[:start] + text[end:]
          insertion = text.index('  private async searchLexical(')
          text = text[:insertion] + helpers + text[insertion:]
          path.write_text(text)
      - name: Format tranche
        run: >-
          pnpm exec prettier --write
          apps/server/src/compose.ts
          apps/server/src/retrieval-projection-operations.ts
          apps/server/src/projection-serving.test.ts
          apps/server/src/vector-acceleration.ts
          apps/server/src/vector-acceleration.test.ts
          apps/worker/src/projection-operations.ts
          apps/worker/src/projection-operations.test.ts
          packages/adapter-postgres/src/public.ts
          packages/adapter-postgres/src/retrieval-projection-hnsw.test.ts
          packages/adapter-postgres/src/retrieval-projection.ts
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src apps/worker/src packages/adapter-postgres/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: satisfy pgvector tranche checks'
          git push origin HEAD:feat/pgvector-hnsw-v1
