name: Refine retrieval v2

on:
  push:
    branches: [feat/retrieval-architecture-v2]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/retrieval-architecture-v2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire candidate source into application
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/application/src/create-app.ts')
          text = p.read_text()
          text = text.replace(
              '  Queue,\n  RerankerProvider,\n} from \'@kotowari/plugin-sdk\';',
              '  Queue,\n  RerankerProvider,\n  RetrievalCandidateSource,\n} from \'@kotowari/plugin-sdk\';',
              1,
          )
          text = text.replace(
              '  embeddings: EmbeddingProvider;\n  reranker?: RerankerProvider;',
              '  embeddings: EmbeddingProvider;\n  candidateSource?: RetrievalCandidateSource;\n  reranker?: RerankerProvider;',
              1,
          )
          text = text.replace(
              '    embeddings: ports.embeddings,\n    reranker: ports.reranker,',
              '    embeddings: ports.embeddings,\n    ...(ports.candidateSource === undefined ? {} : { candidateSource: ports.candidateSource }),\n    reranker: ports.reranker,',
              1,
          )
          p.write_text(text)
          PY
          pnpm exec prettier --write packages/application/src/create-app.ts packages/capability-retrieval/src packages/plugin-sdk/src/ports.ts
          pnpm build
          pnpm test -- --run
      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages
          git commit -m 'refactor: wire retrieval candidate source'
          git push origin HEAD:feat/retrieval-architecture-v2
