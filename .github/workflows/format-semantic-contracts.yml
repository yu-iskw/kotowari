name: Format semantic contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/semantic-contracts-v1
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format semantic contract files
        run: >-
          pnpm exec prettier --write
          packages/capability-ontology/src/claim-validation.test.ts
          packages/capability-ontology/src/claim-validation.ts
          packages/capability-ontology/src/json-ld.ts
          packages/capability-ontology/src/json-schema.ts
          packages/capability-ontology/src/public.ts
          packages/capability-ontology/src/registry.test.ts
          packages/capability-ontology/src/registry.ts
          packages/capability-ontology/src/semantic-contract.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/capability-ontology/src
          git commit -m 'style(ontology): format semantic contracts'
          git push origin HEAD:feat/semantic-contracts-v1
