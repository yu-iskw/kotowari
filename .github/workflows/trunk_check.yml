name: Trunk Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Diagnose SQLite formatting
        run: |
          pnpm exec prettier --write packages/adapter-sqlite/src/sqlite-store.ts
          git diff -- packages/adapter-sqlite/src/sqlite-store.ts

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          setup-deps: true

      # trunk-action leaves this check in_progress when GitHub 503s annotation upload.
      - name: Conclude waiting Trunk Check
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name=="Trunk Check" and .status=="in_progress") | .id')"
          if [ -z "${ids}" ]; then
            echo "No in-progress Trunk Check to conclude"
            exit 0
          fi
          case "${CONCLUSION}" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            *) conclusion=failure ;;
          esac
          attempt=1
          while [ "${attempt}" -le 5 ]; do
            failed=0
            for id in ${ids}; do
              if gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${id}" \
                -f status=completed \
                -f conclusion="${conclusion}" \
                -f "output[title]=Trunk Check" \
                -f "output[summary]=Concluded from Trunk Check Runner after annotation upload."; then
                echo "Concluded check-run ${id} as ${conclusion}"
              else
                failed=1
              fi
            done
            if [ "${failed}" -eq 0 ]; then
              exit 0
            fi
            echo "GitHub API failed on attempt ${attempt}; retrying"
            attempt=$((attempt + 1))
            sleep 20
          done
          echo "Could not conclude waiting Trunk Check after retries"
          exit 1
