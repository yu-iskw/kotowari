name: Prometheus Rules

on:
  pull_request:
    paths:
      - .github/workflows/prometheus_rules.yml
      - infra/observability/prometheus/**
      - apps/server/src/projection-serving.ts
      - apps/server/src/retrieval-rollout-slo.ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate retrieval rollout rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Prometheus rule syntax
        run: >-
          docker run --rm
          --workdir /rules
          --volume "${PWD}/infra/observability/prometheus:/rules:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.13.1
          check rules retrieval-rollout.rules.yml

      - name: Run Prometheus rule unit tests
        run: >-
          docker run --rm
          --workdir /rules
          --volume "${PWD}/infra/observability/prometheus:/rules:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.13.1
          test rules retrieval-rollout.rules.test.yml
