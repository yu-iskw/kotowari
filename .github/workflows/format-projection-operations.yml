name: Format projection operations

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/projection-operations-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/projection-operations-v1
      - shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/server/src/public.ts apps/worker/src/worker.ts
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src/public.ts apps/worker/src/worker.ts
          git commit -m 'style: format projection operations'
          git push origin HEAD:feat/projection-operations-v1
