name: Fix S3 temporal fixture

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'test/pgvector-live-validation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: test/pgvector-live-validation-v1
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/application/src/create-app.test.ts')
          text = path.read_text()
          old = """    const temporal = {\n      validAt: '2026-08-18T23:59:59.000Z',\n      knownAt: '2026-08-18T23:59:59.000Z',\n    };"""
          new = """    const temporalInstant = new Date(Date.now() + 60_000).toISOString();\n    const temporal = {\n      validAt: temporalInstant,\n      knownAt: temporalInstant,\n    };"""
          if old not in text:
              raise SystemExit('expected temporal fixture not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/application/src/create-app.test.ts
          git commit -m 'test: make S3 temporal fixture runtime-safe'
          git push origin HEAD:test/pgvector-live-validation-v1
