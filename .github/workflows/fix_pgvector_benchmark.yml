name: Fix pgvector benchmark

on:
  push:
    branches:
      - test/pgvector-benchmark-rollout-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: test/pgvector-benchmark-rollout-v1
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/projection-serving.pgvector.benchmark.integration.test.ts')
          text = path.read_text()
          old = """      for (const size of CORPUS_SIZES) {\n        results.push(await runCorpusBenchmark(sql, size));\n      }\n      await writeBenchmarkOutput(results);"""
          new = """      for (const size of CORPUS_SIZES) {\n        results.push(await runCorpusBenchmark(sql, size));\n      }\n      expect(results).toHaveLength(CORPUS_SIZES.length);\n      await writeBenchmarkOutput(results);"""
          if old not in text:
              raise SystemExit('benchmark test body not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            apps/server/src/projection-serving.pgvector.benchmark.integration.test.ts \
            .github/workflows/pgvector_benchmark.yml
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src/projection-serving.pgvector.benchmark.integration.test.ts .github/workflows/pgvector_benchmark.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: satisfy benchmark lint contract'
          git push origin HEAD:test/pgvector-benchmark-rollout-v1
