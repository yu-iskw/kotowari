name: Patch entity resolution adapters

on:
  push:
    branches: [feat/entity-identity-resolution-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/entity-identity-resolution-v1
      - name: Add scoped entity listing
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('packages/adapter-sqlite/src/sqlite-store.ts'),
              Path('packages/adapter-postgres/src/postgres-store.ts'),
          ]
          old = '''  async getEntity(id: EntityId): Promise<Entity | undefined> {
            return this.getRecord<Entity>(COLLECTIONS.entities, id);
          }
'''
          replacement = '''  async getEntity(id: EntityId): Promise<Entity | undefined> {
            return this.getRecord<Entity>(COLLECTIONS.entities, id);
          }

          async listEntities(filter: {
            tenantId: TenantId;
            namespaceId?: NamespaceId;
          }): Promise<readonly Entity[]> {
            return this.listRecords<Entity>(COLLECTIONS.entities, filter);
          }
'''
          for path in files:
              text = path.read_text()
              if 'async listEntities(' in text:
                  continue
              if old not in text:
                  raise SystemExit(f'expected getEntity block not found in {path}')
              path.write_text(text.replace(old, replacement, 1))
      - name: Commit adapter patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapter-sqlite/src/sqlite-store.ts packages/adapter-postgres/src/postgres-store.ts
          git commit -m 'feat(adapters): list scoped entities'
          git push origin HEAD:feat/entity-identity-resolution-v1
