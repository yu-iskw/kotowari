name: Patch projection serving

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/projection-serving-gate-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/projection-serving-gate-v1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # capability-retrieval: explicit serving policy + canonical fallback.
          p = Path('packages/capability-retrieval/src/retrieve.ts')
          text = p.read_text()
          marker = "export type RetrievalResult = {\n  hits: readonly RetrievalHit[];\n  omitted: readonly RetrievalOmission[];\n  plan: RetrievalPlan;\n  receipt: RetrievalReceipt;\n};\n"
          policy = marker + "\nexport type RetrievalCandidateSourcePolicy = {\n  available?: () => boolean | Promise<boolean>;\n  fallback?: 'canonical';\n  onSelected?: () => void | Promise<void>;\n  onFallback?: (event: { reason: 'unavailable' | 'error'; error?: unknown }) => void | Promise<void>;\n};\n"
          if 'export type RetrievalCandidateSourcePolicy' not in text:
              text = text.replace(marker, policy, 1)
          old = "  candidateSource?: RetrievalCandidateSource;\n  reranker?: RerankerProvider;"
          new = "  candidateSource?: RetrievalCandidateSource;\n  candidateSourcePolicy?: RetrievalCandidateSourcePolicy;\n  reranker?: RerankerProvider;"
          text = text.replace(old, new, 1)
          old_block = """  const [scored, resolutions] = await Promise.all([\n    input.candidateSource === undefined\n      ? fallbackCandidates({\n          store: input.store,\n          embeddings: input.embeddings,\n          principal: input.principal,\n          query: input.query,\n          temporal,\n          plan,\n        })\n      : indexedCandidates({\n          source: input.candidateSource,\n          store: input.store,\n          embeddings: input.embeddings,\n          principal: input.principal,\n          query: input.query,\n          temporal,\n          plan,\n        }),\n    input.store.listResolutions({ tenantId: input.principal.tenantId }),\n  ]);\n"""
          new_block = """  const canonical = () =>\n    fallbackCandidates({\n      store: input.store,\n      embeddings: input.embeddings,\n      principal: input.principal,\n      query: input.query,\n      temporal,\n      plan,\n    });\n  let sourceId = 'retrieval';\n  let candidatePromise: Promise<Map<string, RetrievalHit>>;\n  if (input.candidateSource === undefined) {\n    candidatePromise = canonical();\n  } else {\n    const available = (await input.candidateSourcePolicy?.available?.()) ?? true;\n    if (!available) {\n      await input.candidateSourcePolicy?.onFallback?.({ reason: 'unavailable' });\n      candidatePromise = canonical();\n    } else {\n      candidatePromise = indexedCandidates({\n        source: input.candidateSource,\n        store: input.store,\n        embeddings: input.embeddings,\n        principal: input.principal,\n        query: input.query,\n        temporal,\n        plan,\n      })\n        .then(async (scored) => {\n          sourceId = input.candidateSource?.id ?? 'retrieval';\n          await input.candidateSourcePolicy?.onSelected?.();\n          return scored;\n        })\n        .catch(async (error: unknown) => {\n          if (input.candidateSourcePolicy?.fallback !== 'canonical') throw error;\n          await input.candidateSourcePolicy.onFallback?.({ reason: 'error', error });\n          return canonical();\n        });\n    }\n  }\n  const [scored, resolutions] = await Promise.all([\n    candidatePromise,\n    input.store.listResolutions({ tenantId: input.principal.tenantId }),\n  ]);\n"""
          if old_block not in text:
              raise SystemExit('retrieve candidate block mismatch')
          text = text.replace(old_block, new_block, 1)
          text = text.replace("source: input.candidateSource?.id ?? 'retrieval',", "source: sourceId,", 1)
          p.write_text(text)

          replace(
              'packages/capability-retrieval/src/public.ts',
              "  RetrievalHit,\n  RetrievalOmission,",
              "  RetrievalCandidateSourcePolicy,\n  RetrievalHit,\n  RetrievalOmission,",
          )

          # application forwards the explicit policy.
          replace(
              'packages/application/src/create-app.ts',
              "import type { RetrievalResult } from '@kotowari/capability-retrieval';",
              "import type { RetrievalCandidateSourcePolicy, RetrievalResult } from '@kotowari/capability-retrieval';",
          )
          replace(
              'packages/application/src/create-app.ts',
              "  retrievalCandidateSource?: RetrievalCandidateSource;\n};",
              "  retrievalCandidateSource?: RetrievalCandidateSource;\n  retrievalCandidateSourcePolicy?: RetrievalCandidateSourcePolicy;\n};",
          )
          replace(
              'packages/application/src/create-app.ts',
              "    ...(ports.retrievalCandidateSource === undefined\n      ? {}\n      : { candidateSource: ports.retrievalCandidateSource }),",
              "    ...(ports.retrievalCandidateSource === undefined\n      ? {}\n      : { candidateSource: ports.retrievalCandidateSource }),\n    ...(ports.retrievalCandidateSourcePolicy === undefined\n      ? {}\n      : { candidateSourcePolicy: ports.retrievalCandidateSourcePolicy }),",
          )

          # expose full projection runtime, keeping maintenance API intact.
          p = Path('apps/server/src/retrieval-projection-operations.ts')
          text = p.read_text()
          text = text.replace(
              "export function createComposeRetrievalProjectionFromEnv(\n  env: Record<string, string | undefined> = process.env,\n): RetrievalProjectionMaintenance {",
              "export function createComposeRetrievalProjectionRuntimeFromEnv(\n  env: Record<string, string | undefined> = process.env,\n): PostgresRetrievalProjection {",
              1,
          )
          text += "\nexport function createComposeRetrievalProjectionFromEnv(\n  env: Record<string, string | undefined> = process.env,\n): RetrievalProjectionMaintenance {\n  return createComposeRetrievalProjectionRuntimeFromEnv(env);\n}\n"
          p.write_text(text)

          # server package dependencies/boundaries.
          p = Path('apps/server/package.json')
          text = p.read_text().replace(
              '"@kotowari/capability-ingestion": "workspace:*",',
              '"@kotowari/capability-ingestion": "workspace:*",\n    "@kotowari/capability-retrieval": "workspace:*",',
              1,
          )
          p.write_text(text)
          p = Path('apps/server/package-boundary.yaml')
          text = p.read_text().replace(
              "  - '@kotowari/capability-ingestion'",
              "  - '@kotowari/capability-ingestion'\n  - '@kotowari/capability-retrieval'",
              1,
          )
          p.write_text(text)

          # compose serving runtime + observability.
          p = Path('apps/server/src/compose.ts')
          text = p.read_text()
          text = text.replace(
              "import { ingestFilesystemPath } from './ingest-fs.js';",
              "import { ingestFilesystemPath } from './ingest-fs.js';\nimport { createProjectionServingGate } from './projection-serving.js';\nimport { createComposeRetrievalProjectionRuntimeFromEnv } from './retrieval-projection-operations.js';",
              1,
          )
          text = text.replace(
              "import type { KotowariApp } from '@kotowari/application';",
              "import type { KotowariApp } from '@kotowari/application';\nimport type { RetrievalCandidateSourcePolicy } from '@kotowari/capability-retrieval';",
              1,
          )
          text = text.replace(
              "import type { BlobStore, IdentityProvider, Queue } from '@kotowari/plugin-sdk';",
              "import type { BlobStore, IdentityProvider, Queue, RetrievalCandidateSource } from '@kotowari/plugin-sdk';",
              1,
          )
          text = text.replace(
              "  queue?: Queue;\n};",
              "  queue?: Queue;\n  retrievalCandidateSource?: RetrievalCandidateSource;\n  retrievalCandidateSourcePolicy?: RetrievalCandidateSourcePolicy;\n};",
              1,
          )
          text = text.replace(
              "      embeddings: createFakeEmbeddingProvider(),\n    },",
              "      embeddings: createFakeEmbeddingProvider(),\n      ...(bindings.retrievalCandidateSource === undefined\n        ? {}\n        : { retrievalCandidateSource: bindings.retrievalCandidateSource }),\n      ...(bindings.retrievalCandidateSourcePolicy === undefined\n        ? {}\n        : { retrievalCandidateSourcePolicy: bindings.retrievalCandidateSourcePolicy }),\n    },",
              1,
          )
          text = text.replace(
              "    return listenKotowariHttp({\n      app: createComposeAppFromEnv(env, identity),",
              "    const projection = createComposeRetrievalProjectionRuntimeFromEnv(env);\n    const projectionServing = createProjectionServingGate(projection);\n    const databaseUrl = requiredEnv(env, 'DATABASE_URL');\n    const app = createComposeApp({\n      sql: createPgPoolClient(databaseUrl),\n      blobs: createS3BlobStore(s3OptionsFromEnv(env)),\n      identity,\n      retrievalCandidateSource: projection,\n      retrievalCandidateSourcePolicy: projectionServing.policy,\n    });\n    return listenKotowariHttp({\n      app,",
              1,
          )
          text = text.replace(
              "      mcpSecurity: {\n        authorization:",
              "      observability: {\n        health: async () => ({ ok: true, projection: await projectionServing.status() }),\n        ready: async () => {\n          const projectionStatus = await projectionServing.status();\n          return { ready: projectionStatus.ready && projectionStatus.healthy, projection: projectionStatus };\n        },\n        metrics: () => projectionServing.metrics(),\n      },\n      mcpSecurity: {\n        authorization:",
              1,
          )
          p.write_text(text)

          # HTTP health/readiness/metrics routes.
          p = Path('apps/server/src/http-server.ts')
          text = p.read_text()
          text = text.replace(
              "type RequestRouterInput = {\n  app: KotowariApp;",
              "export type ServerObservability = {\n  health: () => Promise<Record<string, unknown>>;\n  ready: () => Promise<{ ready: boolean } & Record<string, unknown>>;\n  metrics: () => Promise<string>;\n};\n\ntype RequestRouterInput = {\n  app: KotowariApp;\n  observability?: ServerObservability;",
              1,
          )
          anchor = "async function handleRestRoute(\n"
          route = """async function handleObservabilityRoute(\n  input: RequestRouterInput,\n  request: IncomingMessage,\n  response: ServerResponse,\n  url: URL,\n): Promise<boolean> {\n  if (input.observability === undefined) return false;\n  if (url.pathname === '/healthz') {\n    if (request.method !== 'GET') {\n      writeJson(response, 405, { error: 'method_not_allowed' }, { allow: 'GET' });\n      return true;\n    }\n    writeJson(response, 200, await input.observability.health());\n    return true;\n  }\n  if (url.pathname === '/readyz') {\n    if (request.method !== 'GET') {\n      writeJson(response, 405, { error: 'method_not_allowed' }, { allow: 'GET' });\n      return true;\n    }\n    const ready = await input.observability.ready();\n    writeJson(response, ready.ready ? 200 : 503, ready);\n    return true;\n  }\n  if (url.pathname === '/metrics') {\n    if (request.method !== 'GET') {\n      writeJson(response, 405, { error: 'method_not_allowed' }, { allow: 'GET' });\n      return true;\n    }\n    response.writeHead(200, { 'content-type': 'text/plain; version=0.0.4; charset=utf-8' });\n    response.end(await input.observability.metrics());\n    return true;\n  }\n  return false;\n}\n\n"""
          if route not in text:
              text = text.replace(anchor, route + anchor, 1)
          text = text.replace(
              "  if (handleIndexRoute(request, response, url, input.indexHtml)) {\n    return;\n  }",
              "  if (handleIndexRoute(request, response, url, input.indexHtml)) {\n    return;\n  }\n  if (await handleObservabilityRoute(input, request, response, url)) {\n    return;\n  }",
              1,
          )
          text = text.replace(
              "  mcpStandalonePreset?: McpStandalonePreset;\n}): Promise<{",
              "  mcpStandalonePreset?: McpStandalonePreset;\n  observability?: ServerObservability;\n}): Promise<{",
              1,
          )
          text = text.replace(
              "    app,\n    indexHtml,",
              "    app,\n    ...(options.observability === undefined ? {} : { observability: options.observability }),\n    indexHtml,",
              1,
          )
          p.write_text(text)

          # Public exports.
          p = Path('apps/server/src/public.ts')
          text = p.read_text().replace(
              "export { createComposeRetrievalProjectionFromEnv } from './retrieval-projection-operations.js';",
              "export {\n  createComposeRetrievalProjectionFromEnv,\n  createComposeRetrievalProjectionRuntimeFromEnv,\n} from './retrieval-projection-operations.js';\nexport { createProjectionServingGate } from './projection-serving.js';\nexport type { ProjectionServingGate, ProjectionServingSnapshot } from './projection-serving.js';",
              1,
          ).replace(
              "export type { McpHttpSecurityOptions, ServerMcpAuditEvent } from './http-server.js';",
              "export type { McpHttpSecurityOptions, ServerMcpAuditEvent, ServerObservability } from './http-server.js';",
              1,
          )
          p.write_text(text)
      - run: pnpm install --lockfile-only
      - run: pnpm exec prettier --write packages/capability-retrieval/src/retrieve.ts packages/capability-retrieval/src/public.ts packages/application/src/create-app.ts apps/server/src/retrieval-projection-operations.ts apps/server/src/projection-serving.ts apps/server/src/projection-serving.test.ts apps/server/src/compose.ts apps/server/src/http-server.ts apps/server/src/public.ts apps/server/package.json apps/server/package-boundary.yaml pnpm-lock.yaml
      - run: pnpm --recursive build
      - run: pnpm --filter @kotowari/server test
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/capability-retrieval packages/application apps/server pnpm-lock.yaml
          git commit -m 'feat: add projection serving gate and observability'
          git push origin HEAD:feat/projection-serving-gate-v1
