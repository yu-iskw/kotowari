name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    name: Apply MCP Quality Fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make handler matcher index-based
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/fix-mcp-quality.py')
          text = path.read_text()
          start = text.index('old_map = dedent(')
          end = text.index('\n\nstart = http.index(', start)
          replacement = r'''map_start = http.index("  const handlers = new Map<")
          map_end = http.index("\n  for (const profile of MCP_PROFILES)", map_start)
          http = (
              http[:map_start]
              + "  const handlers = new Map<McpProfile, McpRuntimeHandler>();"
              + http[map_end:]
          )'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Refactor lint findings
        run: python .github/scripts/fix-mcp-quality.py

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/server/src/compose.ts
          apps/server/src/http-server.ts
          docs/adr/0004-mcp-v2-transport.md
          packages/adapter-fs/src/adapter-fs.test.ts
          packages/adapter-fs/src/oauth-introspection-identity-provider.ts
          packages/application/src/create-app.ts
          packages/protocol-mcp/src/mcp-http.test.ts
          packages/protocol-mcp/src/mcp-http.ts
          packages/protocol-mcp/src/mcp-server.ts
          packages/protocol-mcp/src/operation-registry.ts
          packages/protocol-mcp/src/public.ts
          packages/protocol-mcp/src/tool-schemas.test.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps docs packages
          git commit -m "fix(mcp): satisfy quality gates"
          git push origin HEAD:${{ github.head_ref }}
