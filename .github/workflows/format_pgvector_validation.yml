name: Format pgvector validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'test/pgvector-live-validation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: test/pgvector-live-validation-v1
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/adapter-postgres/src/retrieval-projection.pgvector.integration.test.ts
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapter-postgres/src/retrieval-projection.pgvector.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format live pgvector validation'
          git push origin HEAD:test/pgvector-live-validation-v1
