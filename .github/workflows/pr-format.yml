name: PR formatter

on:
  push:
    branches:
      - feat/p0-temporal-accountability-foundation

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format accountability changes
        run: >-
          pnpm exec prettier --write
          packages/adapter-postgres/src/postgres-store.ts
          packages/adapter-sqlite/src/sqlite-store.ts
          packages/plugin-sdk/src/compliance/canonical-store.ts
          packages/plugin-sdk/src/fakes/memory-store.ts
          packages/plugin-sdk/src/ports.ts
          packages/kernel/src/authorization.ts
          packages/kernel/src/authorization-receipt.test.ts
          packages/kernel/src/context.ts
          packages/kernel/src/public.ts
          packages/kernel/src/retrieval.ts
          packages/capability-policy/src/policy.ts
          packages/capability-policy/src/policy.test.ts
          packages/capability-policy/src/public.ts
          packages/capability-knowledge/src/entity-resolution.ts
          packages/capability-knowledge/src/public.ts
          packages/capability-retrieval/src/retrieve.ts
          packages/application/src/accountability.test.ts
          packages/application/src/create-app.ts
          packages/application/src/decision-capability.ts
          packages/application/src/public.ts
          packages/protocol-rest/src/rest.ts
          apps/web/public/index.html

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply prettier to accountability changes"
          git push

# Temporary branch-local formatter; removed before merge.
