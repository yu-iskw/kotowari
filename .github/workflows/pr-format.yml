name: PR formatter

on:
  push:
    branches:
      - feat/p0-temporal-accountability-foundation

permissions:
  contents: write

jobs:
  format:
    name: Align Prettier
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align workspace and Trunk Prettier
        run: |
          pnpm add -Dw prettier@3.9.6
          pnpm exec prettier --write packages/adapter-sqlite/src/sqlite-store.ts

      - name: Commit formatter alignment
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/adapter-sqlite/src/sqlite-store.ts
          git commit -m "build: align prettier with trunk"
          git push
