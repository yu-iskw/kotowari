name: Format decision lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/p0-decision-lifecycle-accountability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format lifecycle sources
        run: |
          pnpm exec prettier --write \
            packages/capability-decision/src/lifecycle.ts \
            packages/kernel/src/events.ts \
            packages/plugin-sdk/src/compliance/decision-lifecycle-store.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/capability-decision/src/lifecycle.ts \
            packages/kernel/src/events.ts \
            packages/plugin-sdk/src/compliance/decision-lifecycle-store.ts
          git commit -m "style: format decision lifecycle accountability"
          git push origin HEAD:${{ github.head_ref }}
