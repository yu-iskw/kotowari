name: Fix entity resolution literals

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/entity-identity-resolution-v1
      - name: Reuse entity resolution constants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/capability-knowledge/src/entity-resolution.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replaceAll("source: 'entity-resolution'", 'source: ENTITY_RESOLUTION_PURPOSE');
          source = source.replaceAll("'knowledge.read'", 'KNOWLEDGE_READ_ACTION');
          source = source.replace(
            'const KNOWLEDGE_READ_ACTION = KNOWLEDGE_READ_ACTION as const;',
            "const KNOWLEDGE_READ_ACTION = 'knowledge.read' as const;",
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/capability-knowledge/src/entity-resolution.ts
          git commit -m 'refactor(knowledge): reuse entity resolution constants'
          git push origin HEAD:feat/entity-identity-resolution-v1
