          lifecycle_capabilities = r'''
type LifecycleAction =
  | 'decision.relate'
  | 'decision.observe'
  | 'decision.approve'
  | 'policy.exception';

async function decisionForLifecycle(input: {
  store: CanonicalStore;
  principal: Principal;
  decisionId: string;
  action: LifecycleAction;
  purpose: string;
}): Promise<Decision | undefined> {
  const decision = await input.store.getDecision(asDecisionId(input.decisionId));
  if (decision === undefined) {
    return undefined;
  }
  assertAllowed(
    input.principal,
    input.action,
    { kind: 'decision', id: decision.id, metadata: decision },
    { tenantId: input.principal.tenantId, purpose: input.purpose },
  );
  return decision;
}

export async function relateDecisionCapability(input: {
  store: CanonicalStore;
  principal: Principal;
  fromDecisionId: string;
  toDecisionId: string;
  kind: DecisionRelationKind;
}): Promise<DecisionRelation | undefined> {
  const from = await decisionForLifecycle({
    ...input,
    decisionId: input.fromDecisionId,
    action: 'decision.relate',
    purpose: 'decision-relate',
  });
  if (from === undefined) {
    return undefined;
  }
  const to = await input.store.getDecision(asDecisionId(input.toDecisionId));
  if (to === undefined) {
    return undefined;
  }
  assertAllowed(
    input.principal,
    'decision.read',
    { kind: 'decision', id: to.id, metadata: to },
    { tenantId: input.principal.tenantId, purpose: 'decision-relate' },
  );
  const relation = createDecisionRelation({
    from,
    to,
    kind: input.kind,
    provenance: compactProvenance({
      source: 'decision',
      actor: input.principal.id,
      process: 'decision.relate',
    }),
  });
  const event = {
    kind: 'decision.related' as const,
    eventId: createEventId(),
    tenantId: relation.tenantId,
    decisionId: relation.fromDecisionId,
    relatedDecisionId: relation.toDecisionId,
    relationId: relation.id,
    provenance: relation.provenance,
    occurredAt: relation.recordedAt,
  };
  await input.store.withTransaction(async (tx) => {
    await tx.putDecisionRelation(relation);
    await tx.appendEvent(event);
    await tx.appendOutbox(event);
  });
  return relation;
}

export async function observeDecisionOutcomeCapability(input: {
  store: CanonicalStore;
  principal: Principal;
  decisionId: string;
  outcome: string;
  metrics?: Readonly<Record<string, OutcomeMetricValue>>;
  evidenceIds?: readonly string[];
}): Promise<OutcomeObservation | undefined> {
  const decision = await decisionForLifecycle({
    ...input,
    action: 'decision.observe',
    purpose: 'decision-observe',
  });
  if (decision === undefined) {
    return undefined;
  }
  const evidenceIds = (input.evidenceIds ?? []).map(asEvidenceId);
  for (const evidenceId of evidenceIds) {
    const evidence = await input.store.getEvidence(evidenceId);
    if (evidence === undefined) {
      throw new Error(`Evidence not found: ${evidenceId}`);
    }
    assertAllowed(
      input.principal,
      'knowledge.read',
      { kind: 'evidence', id: evidence.id, metadata: evidence },
      { tenantId: input.principal.tenantId, purpose: 'decision-observe' },
    );
  }
  const observation = createOutcomeObservation({
    decision,
    outcome: input.outcome,
    ...(input.metrics === undefined ? {} : { metrics: input.metrics }),
    evidenceIds,
    provenance: compactProvenance({
      source: 'decision',
      actor: input.principal.id,
      process: 'decision.observe',
    }),
  });
  const event = {
    kind: 'decision.outcome_observed' as const,
    eventId: createEventId(),
    tenantId: observation.tenantId,
    decisionId: observation.decisionId,
    outcomeObservationId: observation.id,
    provenance: observation.provenance,
    occurredAt: observation.observedAt,
  };
  await input.store.withTransaction(async (tx) => {
    await tx.putOutcomeObservation(observation);
    await tx.appendEvent(event);
    await tx.appendOutbox(event);
  });
  return observation;
}

export async function recordPolicyExceptionCapability(input: {
  store: CanonicalStore;
  principal: Principal;
  decisionId: string;
  policyVersionId: string;
  reason: string;
}): Promise<PolicyException | undefined> {
  const decision = await decisionForLifecycle({
    ...input,
    action: 'policy.exception',
    purpose: 'policy-exception',
  });
  if (decision === undefined) {
    return undefined;
  }
  const policyVersionId = asPolicyVersionId(input.policyVersionId);
  const policies = await input.store.listPolicies({ tenantId: input.principal.tenantId });
  const policy = policies.find(
    (candidate) => policyVersionRef(candidate).policyVersionId === policyVersionId,
  );
  if (policy === undefined) {
    throw new Error(`Policy version not found: ${policyVersionId}`);
  }
  assertAllowed(
    input.principal,
    'policy.exception',
    { kind: 'policy', id: policy.id, metadata: policy },
    { tenantId: input.principal.tenantId, purpose: 'policy-exception' },
  );
  const exception = createPolicyException({
    decision,
    policyVersionId,
    reason: input.reason,
    provenance: compactProvenance({
      source: 'decision',
      actor: input.principal.id,
      process: 'policy.exception',
    }),
  });
  const event = {
    kind: 'policy.exception_recorded' as const,
    eventId: createEventId(),
    tenantId: exception.tenantId,
    decisionId: exception.decisionId,
    policyExceptionId: exception.id,
    policyVersionId: exception.policyVersionId,
    provenance: exception.provenance,
    occurredAt: exception.recordedAt,
  };
  await input.store.withTransaction(async (tx) => {
    await tx.putPolicyException(exception);
    await tx.appendEvent(event);
    await tx.appendOutbox(event);
  });
  return exception;
}

export async function recordDecisionApprovalCapability(input: {
  store: CanonicalStore;
  principal: Principal;
  decisionId: string;
  status: ApprovalRecord['status'];
  method?: string;
  context?: string;
}): Promise<ApprovalRecord | undefined> {
  const decision = await decisionForLifecycle({
    ...input,
    action: 'decision.approve',
    purpose: 'decision-approve',
  });
  if (decision === undefined) {
    return undefined;
  }
  const approval = createApprovalRecord({
    decision,
    approver: input.principal.id,
    status: input.status,
    ...(input.method === undefined ? {} : { method: input.method }),
    ...(input.context === undefined ? {} : { context: input.context }),
    provenance: compactProvenance({
      source: 'decision',
      actor: input.principal.id,
      process: 'decision.approve',
    }),
  });
  const event = {
    kind: 'decision.approval_recorded' as const,
    eventId: createEventId(),
    tenantId: approval.tenantId,
    decisionId: approval.decisionId,
    approvalRecordId: approval.id,
    provenance: approval.provenance,
    occurredAt: approval.recordedAt,
  };
  await input.store.withTransaction(async (tx) => {
    await tx.putApprovalRecord(approval);
    await tx.appendEvent(event);
    await tx.appendOutbox(event);
  });
  return approval;
}

