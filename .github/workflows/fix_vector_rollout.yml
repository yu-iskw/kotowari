name: Fix vector rollout

on:
  push:
    branches:
      - feat/retrieval-rollout-policy-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/retrieval-rollout-policy-v1
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/projection-serving.ts')
          text = path.read_text()
          old = 'if (!snapshot.ready || !snapshot.healthy) {'
          if text.count(old) != 2:
              raise SystemExit(f'expected two readiness guards, found {text.count(old)}')
          path.write_text(text.replace(old, 'if (!snapshot.ready) {'))
          PY
          pnpm exec prettier --write \
            apps/server/src/compose.ts \
            apps/server/src/projection-serving.ts \
            apps/server/src/projection-serving.test.ts \
            apps/server/src/public.ts \
            apps/server/src/vector-acceleration.ts \
            apps/server/src/vector-acceleration.test.ts
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src
          git diff --cached --quiet && exit 0
          git commit -m 'feat: make rollout fallback recoverable'
          git push origin HEAD:feat/retrieval-rollout-policy-v1
