# Kotowari Compose profile: Postgres + MinIO + app + worker.
# Default `pnpm verify` stays offline and does not start these services.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kotowari
      POSTGRES_PASSWORD: kotowari
      POSTGRES_DB: kotowari
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kotowari -d kotowari']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kotowari
      MINIO_ROOT_PASSWORD: kotowari-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        until mc alias set local http://minio:9000 kotowari kotowari-secret; do sleep 1; done;
        mc mb -p local/kotowari;
        exit 0

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KOTOWARI_PROFILE: compose
      DATABASE_URL: postgres://kotowari:kotowari@postgres:5432/kotowari
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kotowari
      S3_ACCESS_KEY: kotowari
      S3_SECRET_KEY: kotowari-secret
      PORT: '8080'
    ports:
      - '8080:8080'

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ['node', 'apps/worker/dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KOTOWARI_PROFILE: compose
      DATABASE_URL: postgres://kotowari:kotowari@postgres:5432/kotowari
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kotowari
      S3_ACCESS_KEY: kotowari
      S3_SECRET_KEY: kotowari-secret

volumes:
  postgres-data:
  minio-data:
